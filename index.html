<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轨迹贴图 · 剪辑素材导出</title>
<style>
  :root{--bg:#0d0f12;--panel:#171a1f;--line:#262b33;--fg:#e6e9ef;--dim:#8a93a2;--accent:#0a84ff;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
    background:var(--bg);color:var(--fg);line-height:1.5}
  header{padding:20px 24px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:18px;font-weight:600}
  header p{margin:4px 0 0;font-size:13px;color:var(--dim)}
  .wrap{max-width:1000px;margin:0 auto;padding:24px}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:32px;text-align:center;
    cursor:pointer;transition:.15s;background:var(--panel)}
  .drop:hover,.drop.over{border-color:var(--accent);background:#12161c}
  .drop strong{color:var(--accent)}
  .drop small{display:block;color:var(--dim);margin-top:6px;font-size:12px}
  .info{margin:14px 0;font-size:13px;color:var(--dim)}
  .info b{color:var(--fg)}
  .main{display:grid;grid-template-columns:1fr 300px;gap:24px;margin-top:8px}
  @media(max-width:760px){.main{grid-template-columns:1fr}}
  .stage{display:flex;flex-direction:column;gap:20px;align-items:center}
  .cardbox{display:inline-block;border-radius:12px;overflow:hidden;
    background-image:
      linear-gradient(45deg,#2a2f37 25%,transparent 25%),
      linear-gradient(-45deg,#2a2f37 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#2a2f37 75%),
      linear-gradient(-45deg,transparent 75%,#2a2f37 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;
    background-color:#20242b}
  canvas#card{display:block;width:360px;height:360px}
  .dotwrap{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px}
  .dotbox{width:72px;height:72px;border-radius:8px;
    background-image:
      linear-gradient(45deg,#2a2f37 25%,transparent 25%),
      linear-gradient(-45deg,#2a2f37 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#2a2f37 75%),
      linear-gradient(-45deg,transparent 75%,#2a2f37 75%);
    background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;background-color:#20242b;
    display:flex;align-items:center;justify-content:center}
  canvas#dot{display:block;width:56px;height:56px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel h2{margin:0 0 12px;font-size:13px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .field{margin-bottom:14px}
  .field label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:5px}
  .field label span{color:var(--fg)}
  input[type=range]{width:100%}
  input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer;padding:2px}
  .row{display:flex;gap:10px}
  .row .field{flex:1}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:12px}
  .btns{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  button.exp{padding:11px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;
    background:var(--accent);color:#fff;transition:.15s}
  button.exp:hover{filter:brightness(1.1)}
  button.exp.sec{background:#2a2f37;color:var(--fg)}
  button.exp:disabled{opacity:.4;cursor:not-allowed}
  .hint{font-size:12px;color:var(--dim);margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
  .hint b{color:var(--fg)}
  .file-list{margin:0 0 14px}
  .file-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
  .file-idx{width:18px;color:var(--dim);text-align:center;flex-shrink:0}
  .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-meta{color:var(--dim);flex-shrink:0;font-size:12px}
  .file-btns{display:flex;gap:4px;flex-shrink:0}
  .file-btns button{width:24px;height:24px;border:none;border-radius:6px;background:var(--line);
    color:var(--fg);cursor:pointer;font-size:13px;line-height:1;transition:.15s}
  .file-btns button:not(:disabled):hover{background:var(--accent);color:#fff}
  .file-btns button:disabled{opacity:.35;cursor:not-allowed}
  input[type=file]{display:none}
</style>
</head>
<body>
<header>
  <h1>轨迹贴图 · 剪辑素材导出</h1>
  <p>把 GPX / KML / TCX / FIT / GeoJSON 骑行轨迹导出成透明 PNG，放进剪映当角落贴图</p>
</header>
<div class="wrap">
  <div class="drop" id="drop">
    <div>拖入轨迹文件（可多选，按顺序首尾相连），或 <strong>点击选择</strong></div>
    <small>支持 .gpx / .kml / .tcx / .fit / .geojson / .csv — 全程本地处理，不上传</small>
  </div>
  <input type="file" id="file" accept=".gpx,.kml,.tcx,.xml,.fit,.geojson,.json,.csv,.txt" multiple>
  <div class="info" id="info">尚未载入轨迹</div>
  <div class="file-list" id="fileList"></div>

  <div class="main">
    <div class="stage">
      <div class="cardbox"><canvas id="card" width="600" height="600"></canvas></div>
      <div class="dotwrap">
        <div class="dotbox"><canvas id="dot" width="128" height="128"></canvas></div>
        <div>单独的定位点<br>放进剪映后用位置关键帧让它沿线路移动</div>
      </div>
    </div>

    <div class="panel">
      <h2>样式</h2>
      <div class="field">
        <label>线路颜色 <span id="lineColorV"></span></label>
        <input type="color" id="lineColor" value="#ffd60a">
      </div>
      <div class="field">
        <label>线宽 <span id="lineWidthV">10</span></label>
        <input type="range" id="lineWidth" min="2" max="30" value="10">
      </div>
      <div class="field">
        <label>底色</label>
        <input type="color" id="bgColor" value="#000000">
      </div>
      <div class="field">
        <label>底色透明度 <span id="bgOpacityV">35%</span></label>
        <input type="range" id="bgOpacity" min="0" max="100" value="35">
      </div>
      <div class="field">
        <label>圆角 <span id="radiusV">64</span></label>
        <input type="range" id="radius" min="0" max="300" value="64">
      </div>
      <div class="field">
        <label>内边距 <span id="padV">70</span></label>
        <input type="range" id="pad" min="20" max="150" value="70">
      </div>

      <h2 style="margin-top:20px">标记</h2>
      <label class="check"><input type="checkbox" id="showMarkers" checked> 显示起点 / 终点</label>
      <div class="row">
        <div class="field">
          <label>起点</label>
          <input type="color" id="startColor" value="#34c759">
        </div>
        <div class="field">
          <label>终点</label>
          <input type="color" id="endColor" value="#ff453a">
        </div>
      </div>

      <h2 style="margin-top:20px">定位点</h2>
      <div class="row">
        <div class="field">
          <label>颜色</label>
          <input type="color" id="dotColor" value="#0a84ff">
        </div>
        <div class="field">
          <label>大小 <span id="dotSizeV">96</span></label>
          <input type="range" id="dotSize" min="32" max="256" value="96">
        </div>
      </div>

      <div class="btns">
        <button class="exp" id="expCard" disabled>导出地图卡片 PNG</button>
        <button class="exp sec" id="expDot">导出定位点 PNG</button>
      </div>
      <div class="hint">
        <b>剪映用法：</b>地图卡片当画中画放角落；把定位点也拖进去，沿线路打几个位置关键帧即可让它移动。不想动就只放地图卡片。
      </div>

      <h2 style="margin-top:20px">MP4 动画导出</h2>
      <div class="row">
        <div class="field">
          <label>时长（秒）</label>
          <input type="number" id="mp4Duration" min="1" max="60" step="0.5" value="6">
        </div>
        <div class="field">
          <label>帧率</label>
          <select id="mp4Fps">
            <option value="24">24</option>
            <option value="30" selected>30</option>
            <option value="60">60</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>分辨率</label>
          <select id="mp4Resolution">
            <option value="720">720</option>
            <option value="1080" selected>1080</option>
            <option value="1440">1440</option>
          </select>
        </div>
        <div class="field">
          <label>背景模式</label>
          <select id="mp4BgMode">
            <option value="card" selected>卡片</option>
            <option value="green">绿幕</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field" id="mp4PageColorField">
          <label>卡片背景色</label>
          <input type="color" id="mp4PageColor" value="#0d0f12">
        </div>
        <div class="field" id="mp4GreenColorField" style="display:none">
          <label>绿幕色</label>
          <input type="color" id="mp4GreenColor" value="#00b140">
        </div>
      </div>
      <div class="field" id="mp4ProgressWrap" style="display:none">
        <label>导出进度 <span id="mp4ProgressV">0%</span></label>
        <progress id="mp4Progress" value="0" max="100" style="width:100%"></progress>
      </div>
      <div class="btns">
        <button class="exp" id="expMp4" disabled>导出 MP4 动画</button>
      </div>
      <div class="hint" id="mp4Status" style="display:none"></div>
    </div>
  </div>
</div>

<script src="mp4-muxer.js"></script>
<script>
const $=id=>document.getElementById(id);
const CARD_SIZE=600;
let trackFiles=[];      // [{name,format,points}] 按列表顺序首尾拼接
let trackPoints=null;   // = concatTrackPoints(trackFiles) 的派生结果

/* ==================== 轨迹解析 ==================== */
function parseFIT(buf){
  const b=buf instanceof Uint8Array?buf:new Uint8Array(buf);
  if(b.length<14) return [];
  const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  const headerSize=b[0];
  if(String.fromCharCode(b[8],b[9],b[10],b[11])!=='.FIT') return [];
  const dataSize=dv.getUint32(4,true);
  let pos=headerSize; const end=Math.min(headerSize+dataSize,b.length);
  const defs={}, points=[]; const SEMI=180/2147483648, EPOCH=631065600;
  const readVal=(off,size,le,signed)=>{ if(size>=4) return signed?dv.getInt32(off,le):dv.getUint32(off,le); if(size===2) return signed?dv.getInt16(off,le):dv.getUint16(off,le); if(size===1) return signed?dv.getInt8(off):dv.getUint8(off); return null; };
  const readData=(def,p)=>{ const v={}; for(const f of def.fields){ if([0,1,2,78,253].includes(f.num)){ v[f.num]=readVal(p,Math.min(f.size,4),def.le,f.num===0||f.num===1); } p+=f.size; } p+=def.devTotal; return {pos:p,v}; };
  const pushPoint=v=>{ const lat=v[0],lng=v[1]; if(lat==null||lng==null||lat===0x7FFFFFFF||lng===0x7FFFFFFF) return; const p={lat:lat*SEMI,lng:lng*SEMI}; if(v[78]!=null&&v[78]!==0xFFFFFFFF) p.ele=v[78]/5-500; else if(v[2]!=null&&v[2]!==0xFFFF) p.ele=v[2]/5-500; if(v[253]!=null&&v[253]!==0xFFFFFFFF) p.time=(v[253]+EPOCH)*1000; points.push(p); };
  while(pos<end){
    const h=b[pos++];
    if(h&0x80){ const lt=(h>>5)&0x3,def=defs[lt]; if(!def) break; const r=readData(def,pos); pos=r.pos; if(def.g===20) pushPoint(r.v); continue; }
    const isDef=(h&0x40)!==0,hasDev=(h&0x20)!==0,lt=h&0x0f;
    if(isDef){
      pos++; const le=b[pos++]===0; const g=dv.getUint16(pos,le); pos+=2;
      const nf=b[pos++]; const fields=[];
      for(let i=0;i<nf;i++){ fields.push({num:b[pos],size:b[pos+1]}); pos+=3; }
      let devTotal=0; if(hasDev){ const nd=b[pos++]; for(let i=0;i<nd;i++){ devTotal+=b[pos+1]; pos+=3; } }
      defs[lt]={g,fields,le,devTotal};
    } else { const def=defs[lt]; if(!def) break; const r=readData(def,pos); pos=r.pos; if(def.g===20) pushPoint(r.v); }
  }
  return points;
}
async function parseTrackFile(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.fit')){
    const pts=parseFIT(new Uint8Array(await file.arrayBuffer()));
    return pts.length>1 ? {points:pts,format:'FIT'} : null;
  }
  const text=await file.text();
  if(name.endsWith('.geojson')||name.endsWith('.json')){
    try{ const c=extractGeoJSONCoords(JSON.parse(text)); if(c.length>1) return {points:c,format:'GeoJSON'}; }catch(_){}
  }
  if(/\.(gpx|kml|tcx|xml)$/.test(name)){
    try{
      const xml=new DOMParser().parseFromString(text,'text/xml');
      if(!xml.querySelector('parsererror')){
        const k=extractKMLCoords(xml); if(k.length>1) return {points:k,format:'KML'};
        const c=extractTCXCoords(xml);  if(c.length>1) return {points:c,format:'TCX'};
        const g=extractGPXCoords(xml);  if(g.length>1) return {points:g,format:'GPX'};
      }
    }catch(_){}
  }
  const t=extractTextCoords(text); if(t.length>1) return {points:t,format:'CSV'};
  return null;
}
function ptFromAttrEl(el){
  const lat=parseFloat(el.getAttribute('lat')),lon=parseFloat(el.getAttribute('lon'));
  if(isNaN(lat)||isNaN(lon)) return null;
  const p={lng:lon,lat};
  const e=el.querySelector('ele'); if(e){ const v=parseFloat(e.textContent); if(!isNaN(v)) p.ele=v; }
  const t=el.querySelector('time'); if(t){ const ms=Date.parse(t.textContent.trim()); if(!isNaN(ms)) p.time=ms; }
  return p;
}
function extractGPXCoords(xml){
  const pts=[];
  xml.querySelectorAll('trkpt').forEach(el=>{ const p=ptFromAttrEl(el); if(p) pts.push(p); });
  if(pts.length===0) xml.querySelectorAll('rtept').forEach(el=>{ const p=ptFromAttrEl(el); if(p) pts.push(p); });
  return pts;
}
function extractTCXCoords(xml){
  const pts=[];
  xml.querySelectorAll('Trackpoint').forEach(tp=>{
    const latEl=tp.querySelector('LatitudeDegrees'), lonEl=tp.querySelector('LongitudeDegrees');
    if(!latEl||!lonEl) return;
    const lat=parseFloat(latEl.textContent), lon=parseFloat(lonEl.textContent);
    if(isNaN(lat)||isNaN(lon)) return;
    const p={lng:lon,lat};
    const a=tp.querySelector('AltitudeMeters'); if(a){ const v=parseFloat(a.textContent); if(!isNaN(v)) p.ele=v; }
    const t=tp.querySelector('Time'); if(t){ const ms=Date.parse(t.textContent.trim()); if(!isNaN(ms)) p.time=ms; }
    pts.push(p);
  });
  return pts;
}
function extractKMLCoords(xml){
  const track=[];
  xml.querySelectorAll('gx\\:Track, Track').forEach(trackEl=>{
    const whens=[...trackEl.querySelectorAll('when')].map(w=>Date.parse(w.textContent.trim()));
    [...trackEl.querySelectorAll('gx\\:coord, coord')].forEach((el,i)=>{
      const p=el.textContent.trim().split(/\s+/);
      const lng=parseFloat(p[0]),lat=parseFloat(p[1]),ele=parseFloat(p[2]);
      if(!isNaN(lng)&&!isNaN(lat)){
        const pt={lng,lat}; if(!isNaN(ele)) pt.ele=ele;
        if(whens[i]!=null&&!isNaN(whens[i])) pt.time=whens[i];
        track.push(pt);
      }
    });
  });
  if(track.length) return track;
  const line=[];
  xml.querySelectorAll('LineString coordinates, Polygon coordinates').forEach(el=>{
    el.textContent.trim().split(/\s+/).forEach(chunk=>{
      const p=chunk.split(','); const lng=parseFloat(p[0]),lat=parseFloat(p[1]),ele=parseFloat(p[2]);
      if(!isNaN(lng)&&!isNaN(lat)){ const pt={lng,lat}; if(!isNaN(ele)) pt.ele=ele; line.push(pt); }
    });
  });
  if(line.length) return line;
  const pt=[];
  xml.querySelectorAll('Placemark Point coordinates').forEach(el=>{
    const p=el.textContent.trim().split(','); const lng=parseFloat(p[0]),lat=parseFloat(p[1]);
    if(!isNaN(lng)&&!isNaN(lat)) pt.push({lng,lat});
  });
  return pt;
}
function extractGeoJSONCoords(geojson){
  const pts=[];
  const mk=c=>{ const pt={lng:c[0],lat:c[1]}; if(c.length>=3&&typeof c[2]==='number') pt.ele=c[2]; return pt; };
  (function walk(o){
    if(!o) return;
    if(o.type==='LineString'&&Array.isArray(o.coordinates)) for(const c of o.coordinates) if(c.length>=2) pts.push(mk(c));
    if(o.type==='MultiLineString'&&Array.isArray(o.coordinates)) for(const l of o.coordinates) for(const c of l) if(c.length>=2) pts.push(mk(c));
    if(o.features) o.features.forEach(walk);
    if(o.geometry) walk(o.geometry);
    if(Array.isArray(o.geometries)) o.geometries.forEach(walk);
  })(geojson);
  return pts;
}
function extractTextCoords(text){
  const out=[];
  for(const line of text.trim().split(/[\n\r]+/)){
    const p=line.trim().split(/[,;\t\s]+/);
    if(p.length>=2){
      const a=parseFloat(p[0]),b=parseFloat(p[1]);
      if(!isNaN(a)&&!isNaN(b)){
        if(Math.abs(a)>90) out.push({lng:a,lat:b});
        else if(Math.abs(b)>90) out.push({lng:b,lat:a});
        else out.push({lng:b,lat:a});
      }
    }
  }
  return out;
}

/* ==================== 几何（复用主 repo，已 node:test 覆盖） ==================== */
function mercatorX(lon){ return lon*(Math.PI/180)*6378137; }
function mercatorY(lat){ const r=lat*(Math.PI/180); return 6378137*Math.log(Math.tan(Math.PI/4+r/2)); }
function smoothTrack(points,target){
  if(points.length>=target||points.length<3) return points;
  const per=Math.ceil(target/(points.length-1));
  const w=[...points];
  w.unshift({lng:points[0].lng*2-points[1].lng,lat:points[0].lat*2-points[1].lat});
  w.push({lng:points.at(-1).lng*2-points.at(-2).lng,lat:points.at(-1).lat*2-points.at(-2).lat});
  const r=[];
  for(let i=1;i<w.length-2;i++){
    const p0=w[i-1],p1=w[i],p2=w[i+1],p3=w[i+2];
    for(let t=0;t<per;t++){
      const tt=t/per,t2=tt*tt,t3=t2*tt;
      r.push({
        lng:0.5*((2*p1.lng)+(-p0.lng+p2.lng)*tt+(2*p0.lng-5*p1.lng+4*p2.lng-p3.lng)*t2+(-p0.lng+3*p1.lng-3*p2.lng+p3.lng)*t3),
        lat:0.5*((2*p1.lat)+(-p0.lat+p2.lat)*tt+(2*p0.lat-5*p1.lat+4*p2.lat-p3.lat)*t2+(-p0.lat+3*p1.lat-3*p2.lat+p3.lat)*t3),
      });
    }
  }
  r.push({...points.at(-1)});
  return r;
}
function projectTrack(points,fullSize){
  const sm=smoothTrack(points,500);
  const xs=sm.map(p=>mercatorX(p.lng)), ys=sm.map(p=>mercatorY(p.lat));
  const xMin=Math.min(...xs),xMax=Math.max(...xs),yMin=Math.min(...ys),yMax=Math.max(...ys);
  const xR=xMax-xMin||1, yR=yMax-yMin||1;
  const maxR=Math.max(xR,yR), half=maxR/2+Math.max(xR*0.05,yR*0.05);
  const xc=(xMin+xMax)/2, yc=(yMin+yMax)/2;
  const xLow=xc-half,xHigh=xc+half,yLow=yc-half,yHigh=yc+half;
  const mapX=mx=>((mx-xLow)/(xHigh-xLow))*fullSize;
  const mapY=my=>fullSize-((my-yLow)/(yHigh-yLow))*fullSize;
  return {points:xs.map((x,i)=>({x:mapX(x),y:mapY(ys[i])}))};
}
function trackDistanceKm(points){
  if(!points||points.length<2) return 0;
  const R=6371000,toR=Math.PI/180; let m=0;
  for(let i=1;i<points.length;i++){
    const a=points[i-1],b=points[i];
    const dLat=(b.lat-a.lat)*toR,dLng=(b.lng-a.lng)*toR;
    const h=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2;
    m+=2*R*Math.asin(Math.sqrt(h));
  }
  return m/1000;
}
// ==================== 沿弧长匀速插值定位点（progress∈[0,1] → 屏幕坐标） ====================
// points 为 projectTrack 输出的屏幕坐标数组，按相邻线段累计弧长匀速插值出 progress 处的点。
function pointAtProgress(points, progress) {
  if (!points || points.length === 0) return null;
  if (points.length === 1) return { x: points[0].x, y: points[0].y };

  const segLengths = [];
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    const dx = points[i].x - points[i - 1].x;
    const dy = points[i].y - points[i - 1].y;
    const len = Math.sqrt(dx * dx + dy * dy);
    segLengths.push(len);
    total += len;
  }

  if (progress <= 0 || total === 0) return { x: points[0].x, y: points[0].y };
  if (progress >= 1) return { x: points[points.length - 1].x, y: points[points.length - 1].y };

  const target = total * progress;
  let acc = 0;
  for (let i = 0; i < segLengths.length; i++) {
    const len = segLengths[i];
    if (len === 0) continue;
    if (acc + len >= target) {
      const f = (target - acc) / len;
      const p0 = points[i], p1 = points[i + 1];
      return { x: p0.x + (p1.x - p0.x) * f, y: p0.y + (p1.y - p0.y) * f };
    }
    acc += len;
  }

  return { x: points[points.length - 1].x, y: points[points.length - 1].y };
}

/* ==================== 多文件拼接 / 列表重排（core.mjs 权威，已 node:test 覆盖） ==================== */
function concatTrackPoints(trackFiles){
  if(!trackFiles.length) return null;
  return trackFiles.flatMap(f=>f.points);
}
function reorderTrackFiles(files,act,i){
  if(act==='del'){ if(i<0||i>=files.length) return [...files]; return files.filter((_,idx)=>idx!==i); }
  if(act==='up'&&i>0&&i<files.length){ const r=[...files]; [r[i-1],r[i]]=[r[i],r[i-1]]; return r; }
  if(act==='down'&&i>=0&&i<files.length-1){ const r=[...files]; [r[i],r[i+1]]=[r[i+1],r[i]]; return r; }
  return [...files];
}

/* ==================== 渲染 ==================== */
function hexToRgba(hex,alpha){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
}
function strokePath(ctx,proj,color,width){
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(proj.points[0].x,proj.points[0].y);
  for(let i=1;i<proj.points.length;i++) ctx.lineTo(proj.points[i].x,proj.points[i].y);
  ctx.stroke();
}
function drawMarker(ctx,pt,color,r){
  ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2);
  ctx.fillStyle=color; ctx.fill();
  ctx.lineWidth=Math.max(2,r*0.35); ctx.strokeStyle='#fff'; ctx.stroke();
}
function renderCard(canvas,size){
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.height=size;
  ctx.clearRect(0,0,size,size);
  if(!trackPoints) return;
  const scale=size/CARD_SIZE;
  const radius=+$('radius').value*scale;
  const pad=+$('pad').value*scale;
  const lineWidth=+$('lineWidth').value*scale;

  ctx.save();
  ctx.beginPath(); ctx.roundRect(0,0,size,size,radius); ctx.clip();
  ctx.fillStyle=hexToRgba($('bgColor').value,+$('bgOpacity').value/100);
  ctx.fillRect(0,0,size,size);

  const proj=projectTrack(trackPoints,size-2*pad);
  ctx.save(); ctx.translate(pad,pad);
  strokePath(ctx,proj,$('lineColor').value,lineWidth);
  if($('showMarkers').checked){
    const mr=Math.max(lineWidth*0.9,7*scale);
    drawMarker(ctx,proj.points[0],$('startColor').value,mr);
    drawMarker(ctx,proj.points.at(-1),$('endColor').value,mr);
  }
  ctx.restore();
  ctx.restore();
}
function renderDot(canvas,size){
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.height=size;
  ctx.clearRect(0,0,size,size);
  const c=size/2, r=size*0.30, ring=size*0.09;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=size*0.08; ctx.shadowOffsetY=size*0.02;
  ctx.beginPath(); ctx.arc(c,c,r+ring,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(c,c,r,0,Math.PI*2); ctx.fillStyle=$('dotColor').value; ctx.fill();
}
// 逐帧渲染（MP4 导出用）：整帧不透明背景 + 全线常显 + 定位点走到 progress 处。
// 复用 projectTrack/strokePath/drawMarker/pointAtProgress；参数全部来自 opts（便于逐帧/离屏，不读 DOM）。
function renderFrame(ctx,size,progress,opts){
  const scale=size/CARD_SIZE;
  const radius=opts.radius*scale, pad=opts.pad*scale, lineWidth=opts.lineWidth*scale;

  ctx.clearRect(0,0,size,size);
  if(!trackPoints) return;

  // 背景第一层：整帧不透明（MP4 无 alpha，避免透出黑）
  ctx.fillStyle=(opts.bgMode==='green')?opts.greenColor:opts.pageColor;
  ctx.fillRect(0,0,size,size);

  ctx.save();
  if(opts.bgMode!=='green'){
    // 卡片模式：圆角裁剪 + 叠半透明卡片底，线路/标记/定位点都画在圆角内
    ctx.beginPath(); ctx.roundRect(0,0,size,size,radius); ctx.clip();
    ctx.fillStyle=hexToRgba(opts.bgColor,opts.bgOpacity);
    ctx.fillRect(0,0,size,size);
  }

  const proj=projectTrack(trackPoints,size-2*pad);
  ctx.translate(pad,pad);
  strokePath(ctx,proj,opts.lineColor,lineWidth);
  if(opts.showMarkers){
    const mr=Math.max(lineWidth*0.9,7*scale);
    drawMarker(ctx,proj.points[0],opts.startColor,mr);
    drawMarker(ctx,proj.points.at(-1),opts.endColor,mr);
  }
  // 定位点：仿 renderDot（白环 + 彩色心 + 阴影），直径随 dotSize*scale
  const p=pointAtProgress(proj.points,progress);
  if(p){
    const d=opts.dotSize*scale, r=d*0.30, ring=d*0.09;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=d*0.08; ctx.shadowOffsetY=d*0.02;
    ctx.beginPath(); ctx.arc(p.x,p.y,r+ring,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fillStyle=opts.dotColor; ctx.fill();
  }
  ctx.restore();
}
function render(){
  renderCard($('card'),CARD_SIZE);
  renderDot($('dot'),+$('dotSize').value);
}

/* ==================== 导出 ==================== */
function download(canvas,filename){
  canvas.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=filename;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },'image/png');
}
function exportCard(){
  if(!trackPoints) return;
  const c=document.createElement('canvas'); renderCard(c,CARD_SIZE);
  download(c,'轨迹卡片.png');
}
function exportDot(){
  const c=document.createElement('canvas'); renderDot(c,+$('dotSize').value);
  download(c,'定位点.png');
}

/* ---- MP4 动画导出（WebCodecs + vendored mp4-muxer） ---- */
const MP4_BITRATE={720:6e6,1080:12e6,1440:20e6};
function mp4Supported(){
  return 'VideoEncoder' in window && 'VideoFrame' in window &&
    typeof VideoEncoder.isConfigSupported==='function' && !!window.Mp4Muxer;
}
function buildFrameOpts(){
  return {
    radius:+$('radius').value,
    pad:+$('pad').value,
    lineWidth:+$('lineWidth').value,
    bgMode:$('mp4BgMode').value,
    pageColor:$('mp4PageColor').value,
    greenColor:$('mp4GreenColor').value,
    bgColor:$('bgColor').value,
    bgOpacity:+$('bgOpacity').value/100,
    lineColor:$('lineColor').value,
    showMarkers:$('showMarkers').checked,
    startColor:$('startColor').value,
    endColor:$('endColor').value,
    dotColor:$('dotColor').value,
    dotSize:+$('dotSize').value,
  };
}
async function pickMp4Codec(size,fps){
  const byRes={720:'avc1.42001f',1080:'avc1.420028',1440:'avc1.420033'};
  const primary=byRes[size]||'avc1.420028';
  const candidates=[...new Set([primary,'avc1.42001f','avc1.420028','avc1.420033'])];
  const bitrate=MP4_BITRATE[size]||1.2e7;
  for(const codec of candidates){
    try{
      const r=await VideoEncoder.isConfigSupported({codec,width:size,height:size,bitrate,framerate:fps});
      if(r&&r.supported) return codec;
    }catch(_){}
  }
  return null;
}
async function exportMp4(){
  if(!trackPoints||!mp4Supported()) return;
  const btn=$('expMp4');
  const duration=Math.max(0.1,+$('mp4Duration').value||6);
  const fps=Math.max(1,+$('mp4Fps').value||30);
  const size=+$('mp4Resolution').value||1080;
  const frames=Math.max(1,Math.round(duration*fps));
  const opts=buildFrameOpts();
  const bitrate=MP4_BITRATE[size]||1.2e7;

  const off=document.createElement('canvas');
  off.width=off.height=size;
  const offCtx=off.getContext('2d');

  btn.disabled=true;
  $('mp4Status').style.display='none';
  $('mp4ProgressWrap').style.display='';
  $('mp4Progress').value=0; $('mp4Progress').max=frames;
  $('mp4ProgressV').textContent='0%';

  let encoder=null;
  try{
    const codec=await pickMp4Codec(size,fps);
    if(!codec) throw new Error('当前浏览器不支持所需的 H.264 编码，请使用最新版 Chrome / Edge，或较新版本的 Safari');

    const target=new Mp4Muxer.ArrayBufferTarget();
    const muxer=new Mp4Muxer.Muxer({ target, video:{ codec:'avc', width:size, height:size }, fastStart:'in-memory' });
    let encodeError=null;
    encoder=new VideoEncoder({
      output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),
      error:e=>{ encodeError=e; }
    });
    encoder.configure({ codec, width:size, height:size, bitrate, framerate:fps });

    for(let i=0;i<frames;i++){
      if(encodeError) throw encodeError;
      const progress=frames>1 ? i/(frames-1) : 0;
      renderFrame(offCtx,size,progress,opts);
      const frame=new VideoFrame(off,{timestamp:Math.round(i*1e6/fps)});
      encoder.encode(frame,{keyFrame:i%fps===0});
      frame.close();
      $('mp4Progress').value=i+1;
      $('mp4ProgressV').textContent=Math.round(((i+1)/frames)*100)+'% ('+(i+1)+'/'+frames+')';
      await new Promise(r=>setTimeout(r));
    }
    await encoder.flush();
    if(encodeError) throw encodeError;
    muxer.finalize();

    const blob=new Blob([target.buffer],{type:'video/mp4'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='轨迹动画.mp4';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);

    $('mp4Status').textContent='导出成功，已下载「轨迹动画.mp4」';
    $('mp4Status').style.display='';
  }catch(err){
    console.error(err);
    $('mp4Status').textContent='导出失败：'+(err&&err.message?err.message:String(err));
    $('mp4Status').style.display='';
  }finally{
    if(encoder&&encoder.state&&encoder.state!=='closed'){ try{encoder.close();}catch(_){} }
    btn.disabled=false;
    $('mp4ProgressWrap').style.display='none';
  }
}

/* ==================== 交互 ==================== */
async function loadTrackFiles(files){
  let added=0; const failed=[];
  for(const file of files){
    try{
      const r=await parseTrackFile(file);
      if(r){ trackFiles.push({name:file.name,format:r.format,points:r.points}); added++; }
      else failed.push(file.name);
    }catch(_){ failed.push(file.name); }
  }
  if(failed.length) alert('无法解析：\n'+failed.join('\n'));
  if(added) recomputeTrack();
}
function recomputeTrack(){
  trackPoints=concatTrackPoints(trackFiles);
  if(!trackPoints){ clearTrack(); return; }
  const km=trackDistanceKm(trackPoints);
  $('info').innerHTML=`合并 <b>${trackFiles.length}</b> 个文件 · <b>${trackPoints.length}</b> 个轨迹点 · 约 <b>${km.toFixed(1)}</b> km`;
  $('expCard').disabled=false;
  if(mp4Supported()) $('expMp4').disabled=false;
  renderFileList();
  render();
}
function renderFileList(){
  const el=$('fileList'); el.innerHTML='';
  trackFiles.forEach((f,i)=>{
    const row=document.createElement('div'); row.className='file-row';
    row.innerHTML=`<span class="file-idx">${i+1}</span>`+
      `<span class="file-name">${f.name}</span>`+
      `<span class="file-meta">${f.format}·${f.points.length}</span>`+
      `<span class="file-btns">`+
        `<button data-act="up" data-i="${i}" ${i===0?'disabled':''}>↑</button>`+
        `<button data-act="down" data-i="${i}" ${i===trackFiles.length-1?'disabled':''}>↓</button>`+
        `<button data-act="del" data-i="${i}">✕</button>`+
      `</span>`;
    el.appendChild(row);
  });
}
function trackFileAction(act,i){
  trackFiles=reorderTrackFiles(trackFiles,act,i);
  recomputeTrack();
}
function clearTrack(){
  trackFiles=[]; trackPoints=null;
  $('info').innerHTML='尚未载入轨迹';
  $('expCard').disabled=true;
  $('expMp4').disabled=true;
  renderFileList();
  render();
}
const drop=$('drop');
drop.onclick=()=>$('file').click();
$('file').onchange=e=>{ if(e.target.files.length) loadTrackFiles(Array.from(e.target.files)); e.target.value=''; };
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) loadTrackFiles(Array.from(e.dataTransfer.files)); });
$('fileList').addEventListener('click',e=>{ const b=e.target.closest('button[data-act]'); if(b) trackFileAction(b.dataset.act,+b.dataset.i); });

// 选项联动
const bind=(id,vid,fmt)=>{ const el=$(id); const upd=()=>{ if(vid)$(vid).textContent=fmt?fmt(el.value):el.value; render(); }; el.addEventListener('input',upd); upd(); };
bind('lineWidth','lineWidthV');
bind('bgOpacity','bgOpacityV',v=>v+'%');
bind('radius','radiusV');
bind('pad','padV');
bind('dotSize','dotSizeV');
['lineColor','bgColor','startColor','endColor','dotColor','showMarkers'].forEach(id=>$(id).addEventListener('input',render));

$('expCard').onclick=exportCard;
$('expDot').onclick=exportDot;
$('expMp4').onclick=exportMp4;
$('mp4BgMode').addEventListener('change',()=>{
  const green=$('mp4BgMode').value==='green';
  $('mp4PageColorField').style.display=green?'none':'';
  $('mp4GreenColorField').style.display=green?'':'none';
});
render();
</script>
